# Shared Codex defaults managed by ~/.dotfiles/codex/config.toml
# Machine-specific project trust should live in ~/.codex/config.local.toml

model_reasoning_effort = "medium"
sandbox_mode = "danger-full-access"
approval_policy = "on-request"

# Codex 會對 hook 定義的 hash 建立信任；每次變更後在 CLI 用 /hooks 複核並信任。
[[hooks.SessionStart]]
matcher = "startup|clear|resume"

[[hooks.SessionStart.hooks]]
type = "command"
command = '"$HOME"/.dotfiles/shared/skills/wait4me/scripts/wait4me-hook.sh session-start'
timeout = 3

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = 'WAIT4ME_ENV_FILE="$HOME/Projects/krepo/.env" "$HOME"/.dotfiles/shared/skills/wait4me/scripts/wait4me-hook.sh prompt'
timeout = 5

[[hooks.PreToolUse]]
matcher = "Bash"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$HOME"/.dotfiles/scripts/outward-action-gate.py --runtime codex'
timeout = 5

[[hooks.PermissionRequest]]

[[hooks.PermissionRequest.hooks]]
type = "command"
command = 'WAIT4ME_ENV_FILE="$HOME/Projects/krepo/.env" "$HOME"/.dotfiles/shared/skills/wait4me/scripts/wait4me-hook.sh permission'
timeout = 5
async = true

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = '"$HOME"/.dotfiles/scripts/agent-turn-end-timestamp.sh codex'
timeout = 3

[[hooks.Stop.hooks]]
type = "command"
command = 'WAIT4ME_ENV_FILE="$HOME/Projects/krepo/.env" "$HOME"/.dotfiles/shared/skills/wait4me/scripts/wait4me-hook.sh stop'
timeout = 5

[[hooks.SessionEnd]]

[[hooks.SessionEnd.hooks]]
type = "command"
command = '"$HOME"/.dotfiles/shared/skills/wait4me/scripts/wait4me-hook.sh session-end'
timeout = 3

[[hooks.SessionStart]]
matcher = "startup|clear|resume|compact|fork"

[[hooks.SessionStart.hooks]]
type = "command"
command = 'python3 "$HOME"/.dotfiles/shared/skills/turbo/scripts/turbo-state.py hook SessionStart --runtime codex'
timeout = 5

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = 'python3 "$HOME"/.dotfiles/shared/skills/turbo/scripts/turbo-state.py hook UserPromptSubmit --runtime codex'
timeout = 5

[[hooks.PermissionRequest]]

[[hooks.PermissionRequest.hooks]]
type = "command"
command = 'python3 "$HOME"/.dotfiles/shared/skills/turbo/scripts/turbo-state.py hook PermissionRequest --runtime codex'
timeout = 5

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = 'python3 "$HOME"/.dotfiles/shared/skills/turbo/scripts/turbo-state.py hook Stop --runtime codex'
timeout = 5

[[hooks.Interrupt]]

[[hooks.Interrupt.hooks]]
type = "command"
command = 'python3 "$HOME"/.dotfiles/shared/skills/turbo/scripts/turbo-state.py hook Interrupt --runtime codex'
timeout = 3

[[hooks.SessionEnd]]

[[hooks.SessionEnd.hooks]]
type = "command"
command = 'python3 "$HOME"/.dotfiles/shared/skills/turbo/scripts/turbo-state.py hook SessionEnd --runtime codex'
timeout = 3

[[hooks.PreToolUse]]
matcher = "Bash"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$HOME"/.dotfiles/shared/skills/turbo/scripts/turbo-state.py hook PreToolUse --runtime codex'
timeout = 5

[notice.model_migrations]
"gpt-5.1-codex" = "gpt-5.3-codex"
"gpt-5.3-codex" = "gpt-5.4"
